# ------------------------------------------------------------
# 重要: 在部署到 Kubernetes 前，请替换此文件中的所有占位符
# ------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-manager-config
data:
  # 请替换以下值为您的实际配置
  AWS_REGION: "your-region"                # 替换为实际的 AWS 区域，例如 cn-northwest-1
  S3_BUCKET_NAME: "your-bucket-name"       # 替换为实际的 S3 桶名
  SECRET_NAME: "your-secret-name"          # 替换为实际的 Secret Manager 密钥名
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-file-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s3-file-manager
  template:
    metadata:
      labels:
        app: s3-file-manager
    spec:
      containers:
      - name: s3-file-manager
        # 请替换镜像地址为您的实际 ECR 仓库地址
        image: your-account-id.dkr.ecr.your-region.amazonaws.com.cn/s3-file-manager:latest
        # 格式：[AWS账户ID].dkr.ecr.[区域].amazonaws.com.cn/s3-file-manager:latest
        imagePullPolicy: Always                # 确保每次都拉取最新镜像
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: s3-manager-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: s3-file-manager-service
spec:
  selector:
    app: s3-file-manager
  ports:
  - port: 80
    targetPort: 5000
  type: LoadBalancer
