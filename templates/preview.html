{% extends 'base.html' %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('files') }}" class="btn btn-outline-secondary">&larr; 返回文件列表</a>
</div>

<div class="card">
    <div class="card-header">
        <h2>预览: {{ file_key }}</h2>
    </div>
    <div class="card-body text-center">
        <img src="{{ image_url }}" class="img-fluid" alt="{{ file_key }}" style="max-height: 80vh;">
    </div>
</div>
{% endblock %}
